<div class="finishedContainer">
    <div class="finished-content-container">
        <mat-form-field>
            <mat-select [(ngModel)]="selectedYear" (selectionChange)="onYearChange($event.value)">
                @for(year of finishedYears; track $index){
                <mat-option [value]="year">{{year}}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        <div class="example-container mat-elevation-z8">
            <div class="example-table-container">

                <table mat-table [dataSource]="dataSource" class="example-table" matSort matSortActive="created"
                    matSortDisableClear matSortDirection="desc">

                    <!-- Title Column -->
                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef> Title </th>
                        <td mat-cell *matCellDef="let element"> {{ element.title }} </td>
                    </ng-container>

                    <!-- Genre Column -->
                    <ng-container matColumnDef="mediaType">
                        <th mat-header-cell *matHeaderCellDef> Genre </th>
                        <td mat-cell *matCellDef="let element"> {{ element.mediaType }} </td>
                    </ng-container>

                    <!-- Finished Date Column -->
                    <ng-container matColumnDef="finishedDate">
                        <th mat-header-cell *matHeaderCellDef> Finished </th>
                        <td mat-cell *matCellDef="let element"> {{ element.finishedDate }} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <mat-paginator [length]="totalCount" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 100]" (page)="onPageChange($event)"
                aria-label="Select page"></mat-paginator>
        </div>
    </div>

</div>
